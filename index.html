<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kimberly Ali: recursos y programas para transformar tu relación con el dinero y sostener una abundancia consciente.">
  <meta name="theme-color" content="#164e3e">
  <title>Kimberly Ali | Abundancia Consciente</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%88%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #261f1d;
      --muted: #765f58;
      --line: #e6d8ce;
      --paper: #faf7f2;
      --soft: #f4ede6;
      --emerald: #164e3e;
      --burgundy: #a8263d;
      --gold: #c8a96b;
      --rose: #d8a7a7;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at 50% -15%, #fff 0, var(--paper) 55%);
      font-family: Montserrat, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .page {
      width: min(100% - 32px, 620px);
      margin: 0 auto;
      padding: 56px 0 34px;
    }

    .brand {
      display: grid;
      justify-items: center;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--emerald);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(44px, 9vw, 64px);
      font-weight: 600;
      line-height: 0.86;
      letter-spacing: 0.03em;
    }

    .eyebrow {
      margin: 12px 0 0;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .intro {
      max-width: 500px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .gallery {
      position: relative;
      width: min(160px, 100%);
      aspect-ratio: 1;
      margin: 0 auto 22px;
      overflow: hidden;
      border-radius: 50%;
      background: var(--soft);
      border: 2px solid var(--gold);
      box-shadow: 0 0 0 8px rgba(200, 169, 107, 0.17), 0 20px 50px rgba(38, 31, 29, 0.14);
    }

    .gallery img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 38px;
    }

    .link-card {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 76px;
      padding: 14px 18px;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fffdfa;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      border-color: var(--gold);
      box-shadow: 0 16px 34px rgba(22, 78, 62, 0.13);
      transform: translateY(-2px);
      outline: none;
    }

    .link-card.primary {
      color: #fff;
      border-color: #e8752e;
      background: linear-gradient(105deg, #ef6c22 0%, #f58a26 48%, #ffb14a 100%);
      box-shadow: 0 14px 30px rgba(213, 82, 26, 0.24), inset 0 1px rgba(255, 255, 255, 0.32);
      animation: cta-vibrate 2.4s ease-in-out infinite;
    }

    .link-card.primary:hover,
    .link-card.primary:focus-visible {
      border-color: #ffd18c;
      box-shadow: 0 18px 38px rgba(213, 82, 26, 0.34), inset 0 1px rgba(255, 255, 255, 0.34);
    }

    @keyframes cta-vibrate {
      0%, 62%, 100% { transform: translate3d(0, 0, 0); }
      64% { transform: translate3d(-1px, 0, 0) rotate(-0.2deg); }
      66% { transform: translate3d(1px, 0, 0) rotate(0.2deg); }
      68% { transform: translate3d(-1px, 0, 0); }
      70% { transform: translate3d(0, 0, 0); }
    }

    .icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      color: var(--emerald);
      background: #edf3ef;
      border-radius: 10px;
      font-size: 20px;
    }

    .primary .icon {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
    }

    .link-copy { min-width: 0; }

    .link-copy strong,
    .link-copy span { display: block; }

    .link-copy strong {
      font-size: 16px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .link-copy span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .primary .link-copy span { color: rgba(255, 255, 255, 0.76); }

    .arrow {
      margin-left: auto;
      font-size: 20px;
      font-weight: 400;
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .social-links a {
      color: inherit;
      font-weight: 600;
      text-decoration: none;
      text-underline-offset: 4px;
    }

    .social-links a:hover,
    .social-links a:focus-visible {
      color: var(--burgundy);
      text-decoration: underline;
      outline: none;
    }

    .feature {
      display: grid;
      gap: 22px;
      align-items: center;
      margin-top: 38px;
      padding: 20px;
      background: var(--soft);
      border-radius: 16px;
    }

    .feature img {
      width: 116px;
      height: 144px;
      object-fit: cover;
      object-position: center top;
      border-radius: 10px;
      background: #ddd;
    }

    .feature h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .feature p {
      margin: 9px 0 15px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .feature a {
      color: var(--burgundy);
      font-size: 14px;
      font-weight: 800;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    footer {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 34px;
      color: var(--muted);
      font-size: 13px;
    }

    footer a { text-decoration: none; }
    footer a:hover, footer a:focus-visible { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 440px) {
      .page { padding-top: 40px; }
      .feature { gap: 16px; padding: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand">
      <section class="gallery" aria-label="Foto de Kimberly Ali">
        <img src="assets/images.jpeg" alt="Kimberly Ali">
      </section>
      <h1>Kimberly Ali</h1>
      <p class="eyebrow">Abundancia consciente</p>
      <p class="intro">Un espacio para transformar tu relación con el dinero, recibir más y sostener tu próximo nivel con seguridad.</p>
    </header>

    <nav class="links" aria-label="Enlaces de Kimberly Ali">
      <a class="link-card primary" href="flujo.html">
        <span class="icon" aria-hidden="true">✦</span>
        <span class="link-copy"><strong>El dinero fluye hacia mí</strong><span>Quiero subir mi ingreso</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <nav class="social-links" aria-label="Redes sociales de Kimberly Ali">
      <a href="https://www.instagram.com/kimberlyali/">Instagram</a>
      <a href="https://www.tiktok.com/@kimberlyali">TikTok</a>
      <a href="https://www.youtube.com/watch?v=-lOrt4ffTnk">YouTube</a>
    </nav>

  </main>
  <script src="/assets/site-nav-abundancia.js"></script>
</body>
</html>
